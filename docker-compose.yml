services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: city_route_booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d city_route_booking"]
      interval: 5s
      timeout: 3s
      retries: 10
